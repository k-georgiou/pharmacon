# ============================================================================
# Pharmacon — Plot Config: Number of Hydrogen Bonds per Frame
# ----------------------------------------------------------------------------
# Grouping   : H-bond count vs frame (time series).
# Applies to : .pta files produced by `trajectory h-bonds` (non-merged only)
# Alias names recognized by the parser:
#   HBONDS-COUNT-PER-FRAME / HBONDS_COUNT_PER_FRAME / HB-COUNT / HB_COUNT
# ============================================================================

[HBONDS-COUNT-PER-FRAME]

# ---------------- FIGURE ----------------
fig_size_width   = 8
fig_size_height  = 5
fig_dpi          = 300
fig_format       = png
bg_color         = white

# ---------------- TITLES / LABELS ----------------
fig_title        = Hydrogen Bonds per Frame
x_label          = Frame
y_label          = Number of H-bonds
x_axis           = frame_index    # frame_index | time_ns | time_ps | time_us

# ---------------- LINE ----------------
line_width       = 1.5
line_style       = solid
# line_colors accepts a comma-separated list (the first color is used here):
#   line_colors = "#1f77b4", "#ff7f0e"

# ---------------- GRID ----------------
enable_grid      = True
grid_style       = dashed
grid_alpha       = 0.4

# ---------------- ALSO AVAILABLE ----------------
# Settings this plot accepts that were not listed above. The value shown
# is the default, so uncommenting one without changing it does nothing.
# fig_transparent          = False
# tight_layout             = True
# font_family              = dejavu sans
# font_size_title          = 14
# font_weight_title        = bold
# font_size_label          = 10
# font_weight_label        = normal
# font_size_ticks          = 8
# line_alpha               = 1.0
# line_colors              = "#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf"
# disable_title            = False
# legend_loc               = best
# legend_n_col             = 1
# grid_color               =              # unset: matplotlib's own grid colour
# grid_linewidth           =              # unset: matplotlib's own grid width
# x_tick_rotation          = 0.0
# y_tick_rotation          = 0.0
# font_size_x              = 
# font_size_y              = 
# font_weight_x            = 
# font_weight_y            = 
# disable_x_label          = False
# disable_y_label          = False
