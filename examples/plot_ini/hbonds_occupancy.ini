# ============================================================================
# Pharmacon — Plot Config: Hydrogen-Bond Occupancy (ranked bar)
# ----------------------------------------------------------------------------
# Grouping   : per residue-pair % occupancy (fraction of frames present),
#              strongest at top. Built from mode2 (once-per-frame).
# Applies to : .pta files produced by `trajectory h-bonds`
# Alias names recognized by the parser:
#   HBONDS-OCCUPANCY / HBONDS_OCCUPANCY / HB-OCCUPANCY / HB_OCCUPANCY
# ============================================================================

[HBONDS-OCCUPANCY]

# ---------------- FIGURE ----------------
fig_size_width   = 8
fig_size_height  = 10
fig_dpi          = 300
fig_basename     = hbonds_occupancy
fig_format       = png
bg_color         = white

# ---------------- TITLES / LABELS ----------------
fig_title        = Hydrogen Bond Occupancy
x_label          = Occupancy (fraction of frames)
y_label          = Residue Pair

# ---------------- DATA SELECTION ----------------
top_n            = 25             # keep the N most-occupied pairs (0 = all)
threshold        = 0.0            # drop pairs below this occupancy

# ---------------- BARS ----------------
bar_color        = "#3498db"
bar_alpha        = 0.9
bar_edge_color   = black
bar_edge_width   = 0.5

# ---------------- LABELING ----------------
representation   = chainid:resnameresid
aa3_to_aa1       = True

# ---------------- GRID ----------------
enable_grid      = True
grid_style       = dashed
grid_alpha       = 0.4

# ---------------- ALSO AVAILABLE ----------------
# Settings this plot accepts that were not listed above. The value shown
# is the default, so uncommenting one without changing it does nothing.
# fig_transparent          = False
# tight_layout             = True
# font_family              = dejavu sans
# font_size_title          = 14
# font_weight_title        = bold
# font_size_label          = 12
# font_weight_label        = bold
# font_size_ticks          = 8
# disable_title            = False
# legend_loc               = best
# legend_n_col             = 1
# grid_color               =              # unset: matplotlib's own grid colour
# grid_linewidth           =              # unset: matplotlib's own grid width
# x_tick_rotation          = 0.0
# y_tick_rotation          = 0.0
# font_size_x              =              # unset: follows font_size_label
# font_size_y              =              # unset: follows font_size_label
# font_weight_x            =              # unset: follows font_weight_label
# font_weight_y            =              # unset: follows font_weight_label
# disable_x_label          = False
# disable_y_label          = False
