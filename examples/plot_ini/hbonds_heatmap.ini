# Pharmacon — Plot Config: Hydrogen-Bond Residue×Residue Frequency Heatmap
# ----------------------------------------------------------------------------
# Grouping   : residue × residue H-bond contact frequency map
# Applies to : .pta files produced by `trajectory h-bonds`
# Alias names recognized by the parser:
#   HBONDS-HEATMAP / HBONDS_HEATMAP / HB-HEATMAP / HB_HEATMAP
# ============================================================================

[HBONDS-HEATMAP]

# ---------------- FIGURE ----------------
fig_size_width   = 16
fig_size_height  = 14
fig_dpi          = 300
fig_basename     = hbonds_heatmap
fig_format       = png
bg_color         = white

# ---------------- TITLES / LABELS ----------------
fig_title        = Hydrogen Bond Contact Frequency
x_label          = Residue
y_label          = Residue

# ---------------- FILTERS ----------------
threshold        = 0.02           # drop pairs below this mean frequency
min_total        = 0.0
top_n            = 0              # 0 = keep all; N = keep N strongest pairs
symmetric        = True

# ---------------- LABELING ----------------
representation   = chainid:resnameresid
aa3_to_aa1       = False

# ---------------- VALUE MAPPING ----------------
cmap             = viridis
vmin             = 0.0
vmax             =                # empty = auto
interpolation    = nearest

# ---------------- COLORBAR ----------------
cbar_orientation = vertical

# ---------------- ALSO AVAILABLE ----------------
# Settings this plot accepts that were not listed above. The value shown
# is the default, so uncommenting one without changing it does nothing.
# fig_transparent          = False
# tight_layout             = True
# font_size_title          = 20
# font_weight_title        = bold
# font_size_label          = 16
# font_weight_label        = bold
# font_size_x              = 8
# font_weight_x            = normal
# font_size_y              = 8
# font_weight_y            = normal
# font_size_cbar           = 12
# font_family              = dejavu sans
# x_tick_rotation          = 90.0
# y_tick_rotation          = 0.0
# renumber                 = False
# renumber_int             = 
# alter_chains             = False
# alter_segments           = False
# alter_chains_str         = 
# alter_segments_str       = 
# enable_grid              = False
# grid_color               = black
# grid_linewidth           = 0.2
# disable_colorbar         = False
# cbar_shrink              = 1.0
# cbar_pad                 = 0.04
# disable_title            = False
# disable_x_axis           = False
# disable_y_axis           = False
# disable_x_label          = False
# disable_y_label          = False
# disable_ticks            = False
