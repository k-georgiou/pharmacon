# ============================================================================
# Pharmacon — Plot Config: PCA Explained Variance (Scree Plot)
# ----------------------------------------------------------------------------
# Applies to : .pta files with a PCA dataset
# Alias names recognized by the parser:
#   PCA-VARIANCE-RATIO
#   PCA_VARIANCE_RATIO
#   PCA-SCREE
#   PCA_SCREE
# ============================================================================

[PCA-VARIANCE-RATIO]

# ---------------- FIGURE ----------------
fig_size_width   = 8
fig_size_height  = 6
fig_dpi          = 300
fig_basename     = pca_variance_ratio
fig_format       = png
fig_transparent  = False
tight_layout     = True
bg_color         = white

# ---------------- TITLES / LABELS ----------------
fig_title        = PCA Explained Variance
x_label          = Principal Component
y_label          = Explained Variance Ratio

# ---------------- FONTS ----------------
font_family       = dejavu sans
font_size_title   = 14
font_size_label   = 12
font_size_ticks   = 10
font_weight_title = bold

# ---------------- BARS & CUMULATIVE LINE ----------------
bar_alpha             = 0.8
cumulative_line       = True
cumulative_line_width = 2.0
cumulative_alpha      = 0.9

# ---------------- GRID ----------------
enable_grid      = True
grid_style       = dashed
grid_alpha       = 0.3

disable_title    = False

# ---------------- ALSO AVAILABLE ----------------
# Settings this plot accepts that were not listed above. The value shown
# is the default, so uncommenting one without changing it does nothing.
# legend_loc               = best
# legend_n_col             = 1
# grid_color               =              # unset: matplotlib's own grid colour
# grid_linewidth           =              # unset: matplotlib's own grid width
# x_tick_rotation          = 0.0
# y_tick_rotation          = 0.0
# font_size_x              = 
# font_size_y              = 
# font_weight_x            = 
# font_weight_y            = 
# disable_x_label          = False
# disable_y_label          = False
