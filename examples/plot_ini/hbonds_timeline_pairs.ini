# Pharmacon — Plot Config: Hydrogen-Bond Pair Occupancy Timeline
# ----------------------------------------------------------------------------
# Grouping   : residue-pair (rows) × frame (cols), present/absent heatmap.
#              The classic H-bond persistence plot.
# Applies to : .pta files produced by `trajectory h-bonds` (non-merged only)
# Alias names recognized by the parser:
#   HBONDS-TIMELINE-PAIRS / HBONDS_TIMELINE_PAIRS / HB-TIMELINE / HB_TIMELINE
# ============================================================================

[HBONDS-TIMELINE-PAIRS]

# ---------------- FIGURE ----------------
fig_size_width   = 14
fig_size_height  = 8
fig_dpi          = 300
fig_basename     = hbonds_timeline_pairs
fig_format       = png
bg_color         = white

# ---------------- TITLES / LABELS ----------------
fig_title        = Hydrogen Bond Pairs – Timeline
x_label          = Frame
y_label          = Residue Pair

# ---------------- DATA SELECTION ----------------
top_n            = 50             # keep the N strongest pairs
threshold        = 0.02
drop_empty_rows  = True
xtick_max        = 50             # thin frame ticks to ~this many (avoids overlap)

# ---------------- LABELING ----------------
representation   = chainid:resnameresid
aa3_to_aa1       = False

# ---------------- VALUE MAPPING ----------------
cmap             = gnuplot
vmin             = 0.0
vmax             = 1.0
interpolation    = nearest

# ---------------- ALSO AVAILABLE ----------------
# Settings this plot accepts that were not listed above. The value shown
# is the default, so uncommenting one without changing it does nothing.
# fig_transparent          = False
# tight_layout             = True
# font_size_x              = 10
# font_weight_x            = normal
# font_size_y              = 10
# font_weight_y            = normal
# font_size_label          = 14
# font_weight_label        = bold
# font_size_title          = 18
# font_weight_title        = bold
# font_size_cbar           = 10
# font_family              = dejavu sans
# x_tick_rotation          = 0.0
# y_tick_rotation          = 0.0
# renumber                 = False
# renumber_int             = 
# alter_chains             = False
# alter_segments           = False
# alter_chains_str         = 
# alter_segments_str       = 
# enable_grid              = False
# grid_color               = black
# grid_linewidth           = 0.2
# disable_colorbar         = False
# cbar_orientation         = vertical
# cbar_shrink              = 1.0
# cbar_pad                 = 0.04
# disable_title            = False
# disable_x_axis           = False
# disable_y_axis           = False
# disable_x_label          = False
# disable_y_label          = False
# disable_ticks            = False
