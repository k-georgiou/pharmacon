# ============================================================================
# Pharmacon — Plot Config: RMSD Time-series
# ----------------------------------------------------------------------------
# Root Mean Square Deviation against time, one curve per selection.
# Applies to : .pta files produced by `trajectory rmsd`, both single and
#              merged (mean ± std band drawn automatically on merged files).
#
# RMSD has no settings class of its own: it is a per-frame scalar, so it shares
# one plotter with angles and distances. Keep the section name below as it is
# even in an RMSD-only file — it is what the parser looks for, and the same
# section configures `trajectory angles` and `trajectory distances` output.
# For per-atom RMSF see rmsf.ini ([PTA-RMSF]), which is a different class.
#
# Alias names recognized by the parser:
#   PTA-UNIFIED
#   PTA_UNIFIED
#
#   pharmacon plot pta -i rmsd.pta -o figures -c rmsd.ini
#
# Every key is optional and every value shown is the default. An invalid value
# is never fatal: the plotter warns, falls back to the default, and carries on.
# ============================================================================

[PTA-UNIFIED]

# ---------------- FIGURE ----------------
fig_size_width   = 8          # inches, 2 – 60
fig_size_height  = 5          # inches, 2 – 60
fig_dpi          = 300        # 50 – 2000
fig_format       = png        # png | pdf | svg | jpg | jpeg | tif | tiff
fig_transparent  = False      # True drops the figure background
tight_layout     = True       # shrink margins to fit the labels
bg_color         = white      # matplotlib colour name or #rrggbb

# ---------------- TITLE AND LABELS ----------------
fig_title        = Backbone RMSD
disable_title    = False      # True suppresses the title entirely
x_label          = Time (ns)
y_label          = RMSD (Å)
x_axis           = time_ns    # time_ps | time_ns | time_us | frame_index
                              # ('frame' is accepted as an alias for frame_index)

# ---------------- FONTS ----------------
# font_family must be installed; an unknown name falls back with a warning.
# arial, helvetica, times new roman, courier new and dejavu sans are usual.
font_family        = dejavu sans
font_size_title    = 14       # >= 1
font_size_label    = 10
font_size_ticks    = 8
font_size_legend   = 8
# weights: normal | regular | book | medium | roman | light | ultralight
#          semibold | demi | demibold | bold | extra bold | heavy | black
font_weight_title  = bold
font_weight_label  = normal
font_weight_legend = normal

# ---------------- LINES ----------------
line_width   = 1.5            # 0.1 – 10
line_alpha   = 1.0            # 0.0 – 1.0
line_style   = solid          # solid | dashed | dashdot | dotted | - | -- | -. | :
# One colour per selection. Each hex value MUST be wrapped in double quotes:
# a bare '#' starts a comment and the whole value would be read as empty.
# Keep it on ONE line — the parser splits on commas, and a list broken across
# lines is read character by character.
line_colors  = "#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf"
cycle_colors = True           # False paints every selection the first colour

# ---------------- MERGED REPLICAS ----------------
# These apply only to a merged artifact (`pharmacon merge results`). A single
# run has no spread to draw, so no band appears whatever is set here.
show_std_band  = True         # shaded ±1 SD across replicas around the mean
std_band_alpha = 0.25         # 0.0 – 1.0

# ---------------- AXIS LIMITS ----------------
# 'auto' keeps matplotlib's autoscaling for that end. Set either end of either
# axis on its own — y_min = 0 with y_max = auto is fine.
x_min = auto                  # auto | a number, in the units of x_axis
x_max = auto
y_min = auto                  # e.g. 0 to anchor RMSD at the origin
y_max = auto

# ---------------- GRID ----------------
enable_grid = True
grid_style  = dashed          # same vocabulary as line_style
grid_alpha  = 0.4             # 0.0 – 1.0

# ---------------- LEGEND ----------------
disable_legend = False
legend_frame   = True         # draw the box around it
legend_alpha   = 1.0          # 0.0 – 1.0, applies to the frame

# ---------------- DATA REDUCTION AND OUTPUT ----------------
plot_every_n  = 1             # 1 – 100000; keep every Nth frame. 10 thins a
                              # 50,000-frame trace to 5,000 points
plot_multiple = False         # False: every selection on one axes, one file
                              # True:  one file per selection, named after it
